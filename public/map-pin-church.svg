<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44" fill="none">
  <defs>
    <filter id="pin-shadow" x="-20%" y="-10%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#001850" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pin-grad" x1="18" y1="0" x2="18" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f49bb"/>
      <stop offset="100%" stop-color="#003198"/>
    </linearGradient>
  </defs>
  <!-- Pin Body with Shadow -->
  <path d="M18 1C8.611 1 1 8.611 1 18c0 12.5 17 25 17 25s17-12.5 17-25c0-9.389-7.611-17-17-17z"
